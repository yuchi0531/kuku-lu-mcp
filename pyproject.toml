[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuku-lu-mcp"
version = "0.1.0"
description = "MCP server for m.kuku.lu (捨てメアド) disposable Japanese mailboxes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "tempmail", "disposable-email", "kuku.lu", "japan"]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
kuku-lu-mcp = "kukulumcp.server:main"

[tool.setuptools.packages.find]
include = ["kukulumcp*"]
